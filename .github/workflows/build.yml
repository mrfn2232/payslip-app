name: build-windows-exe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pyinstaller openpyxl
      - run: python -m PyInstaller --onefile --windowed --name PayslipMaker app.py
      - uses: actions/upload-artifact@v4
        with: { name: PayslipMaker, path: dist/PayslipMaker.exe }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PayslipMaker (latest)
          files: dist/PayslipMaker.exe
